name: Cloud Linux smoke test (issue 9)

# Always check changes to the isolated research branch, including new test files.
# Never load Groq credentials for this workflow.
on:
  push:
    branches:
      - feature/issue9-cloud-readiness-audit
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-smoke:
    if: github.ref == 'refs/heads/feature/issue9-cloud-readiness-audit' || github.head_ref == 'feature/issue9-cloud-readiness-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install minimal cloud runtime
        run: python -m pip install --disable-pip-version-check -r requirements-cloud.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run offline unit regression
        env:
          FOOTBALL_V2_FACTS_FIRST: '0'
          FOOTBALL_GROQ_ENABLED: '0'
        run: python -m unittest discover -s tests -v
      - name: Audit deterministic investigator answers
        run: python -m scripts.audit_v2_investigator_answers
      - name: Compare investigator with deterministic compiler (no Groq)
        run: python -m scripts.compare_v2_investigator
      - name: Evaluate conditional evidence uplift (guided offline, not Groq)
        run: python -m scripts.evaluate_v2_conditional_value
      - name: Check private preview syntax and devcontainer config
        run: |
          python -m py_compile app/v2_groq_preview.py app/v2_investigator_lab.py scripts/evaluate_v2_groq_shadow.py scripts/evaluate_v2_investigator.py
          python - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path(".devcontainer/devcontainer.json").read_text())
          assert 8501 in config["forwardPorts"]
          assert config["postAttachCommand"] == "bash .devcontainer/start-preview.sh"
          assert config["containerEnv"]["FOOTBALL_GROQ_MODEL"] == "openai/gpt-oss-20b"
          print("Private preview config and Python syntax OK")
          PY
      - name: Run real-data V2 investigator guided control (not Groq)
        run: python -m scripts.evaluate_v2_investigator
      - name: Run full V2 offline conversation acceptance
        env:
          FOOTBALL_V2_FACTS_FIRST: '0'
        run: python -m scripts.evaluate_v2_conversations
      - name: Validate committed runtime assets and DuckDB
        run: python scripts/validate_project.py
      - name: Verify real football answer without Ollama or external LLM
        run: |
          python - <<'PY'
          from analytics.football_analytics import get_team_record
          from agent.football_tools import frozen_gameweek_predictions

          record = get_team_record("Liverpool", "2025/26")
          assert len(record) == 1, "Historical Liverpool record missing"
          played = int(record.iloc[0]["Played"])
          won = int(record.iloc[0]["Won"])
          drawn = int(record.iloc[0]["Drawn"])
          lost = int(record.iloc[0]["Lost"])
          assert played == 38 and won + drawn + lost == played
          frozen = frozen_gameweek_predictions(8)
          assert not frozen.get("error"), frozen.get("error")
          assert len(frozen["data"]) == 10 and "Model2_v1.0" in frozen["models"]
          print("PASS: Liverpool 2025/26 played", played, "won", won, "drawn", drawn, "lost", lost)
          print("PASS: GW8 immutable forecasts", len(frozen["data"]), "models", frozen["models"])
          print("PASS: Deterministic cloud answer obtained; Ollama not called")
          PY
