name: H10 two-stage match-statistics empirical screen
on:
  push:
    branches:
      - experiments/h10-two-stage-stat-forecast
    paths:
      - "experiments/h10_two_stage/**"
      - ".github/workflows/h10_two_stage_screen.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  empirical-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install free modelling libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==1.26.4" "pandas==2.2.3" "scipy==1.14.1" "scikit-learn==1.5.2" "statsmodels==0.14.4"
      - name: Train and score two-stage models against frozen benchmark
        run: python experiments/h10_two_stage/bounded_screen.py
      - name: Preserve result artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h10-two-stage-results
          path: |
            reports/h10_two_stage/
            docs/experiments/H10_TWO_STAGE_STAT_SCREEN.md
          if-no-files-found: warn
      - name: Commit reproducible results to isolated research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/h10_two_stage/results.json reports/h10_two_stage/predictions.csv docs/experiments/H10_TWO_STAGE_STAT_SCREEN.md
          git commit -m "Record H10 two-stage empirical screen results" || exit 0
          git push origin HEAD:experiments/h10-two-stage-stat-forecast
