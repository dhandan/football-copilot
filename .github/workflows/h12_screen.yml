name: H12 bounded cross-market historical experiment
on:
  push:
    branches:
      - experiments/h12-cross-market-ah-ou
    paths:
      - "experiments/h12_cross_market/**"
      - ".github/workflows/h12_screen.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install modelling tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==1.26.4" "pandas==2.2.3" "scipy==1.14.1" "scikit-learn==1.5.2"
      - name: Run H12 test
        run: python experiments/h12_cross_market/screen.py
      - name: Capture results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h12-cross-market
          path: |
            reports/h12_cross_market/
            docs/experiments/H12_CROSS_MARKET_SCREEN.md
      - name: Preserve run on research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/h12_cross_market/results.json reports/h12_cross_market/predictions.csv docs/experiments/H12_CROSS_MARKET_SCREEN.md
          git commit -m "Record H12 bounded cross-market evidence" || exit 0
          git push origin HEAD:experiments/h12-cross-market-ah-ou
