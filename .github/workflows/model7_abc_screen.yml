name: Model7 ABC bounded empirical screen
on:
  push:
    branches:
      - experiments/model7-abc-screen
    paths:
      - "experiments/model7_abc/**"
      - ".github/workflows/model7_abc_screen.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bounded-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==1.26.4" "pandas==2.2.3" "scipy==1.14.1" "scikit-learn==1.5.2" "catboost==1.2.8" "requests==2.32.3"
      - name: Run identical fixture A/B/C
        run: python experiments/model7_abc/bounded_screen.py
      - name: Store outputs as workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model7-abc-results
          path: |
            reports/model7_screen/
            docs/experiments/MODEL7_ABC_EMPIRICAL_RESULTS.md
          if-no-files-found: warn
      - name: Commit research outputs to isolated branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/model7_screen/results.json reports/model7_screen/predictions.csv docs/experiments/MODEL7_ABC_EMPIRICAL_RESULTS.md
          git commit -m "Record Model7 A/B/C empirical screening results" || exit 0
          git push origin HEAD:experiments/model7-abc-screen
