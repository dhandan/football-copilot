name: V2 Groq Free single-run live evaluation

# Final one-off safe error-code classification run, 9 Nov 2026.
# Runs only on exact experimental branch, never on pull requests or a schedule.
# No PR secrets, no deployment; user confirmed Free plan, ZDR and private key.
on:
  push:
    branches:
      - feature/issue9-cloud-readiness-audit
    paths:
      - .github/workflows/v2-groq-free-eval.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-groq-free-eval
  cancel-in-progress: false

jobs:
  evaluate:
    # Only this repo/branch may receive the protected repository secret.
    if: github.repository == 'dhandan/football-copilot' && github.ref == 'refs/heads/feature/issue9-cloud-readiness-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      FOOTBALL_GROQ_ENABLED: '1'
      FOOTBALL_GROQ_FREE_PLAN_CONFIRMED: '1'
      FOOTBALL_GROQ_ZDR_CONFIRMED: '1'
      FOOTBALL_GROQ_MODEL: 'openai/gpt-oss-20b'
      FOOTBALL_V2_FACTS_FIRST: '0'
      FOOTBALL_AGENT_DEBUG: '0'
    steps:
      - name: Checkout without persisted Git credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install existing minimal cloud dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-cloud.txt
      - name: Preflight secret is available (never print its value)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python - <<'PY'
          import os
          from agent.groq_v2 import groq_ready
          if not groq_ready():
              raise SystemExit("NO-GO: Secret unavailable or explicit Free/ZDR/model gate failed")
          print("PASS: opted-in Free/ZDR credential gate (user-attested; not independently account-verified)")
          PY
      - name: Run one bounded live 13-turn Groq V2 acceptance
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m scripts.evaluate_v2_conversations --live --groq
