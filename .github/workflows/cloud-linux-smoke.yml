name: Cloud Linux smoke test (issue 9)

on:
  push:
    branches: [feature/issue9-cloud-readiness-audit]
    paths:
      - ".github/workflows/cloud-linux-smoke.yml"
      - "requirements-cloud.txt"
      - "scripts/audit_cloud_readiness.py"
      - "tests/test_cloud_readiness_audit.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/cloud-linux-smoke.yml"
      - "requirements-cloud.txt"
      - "scripts/audit_cloud_readiness.py"
      - "tests/test_cloud_readiness_audit.py"

permissions:
  contents: read

jobs:
  linux-smoke:
    if: github.head_ref == 'feature/issue9-cloud-readiness-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install minimal cloud runtime
        run: python -m pip install --disable-pip-version-check -r requirements-cloud.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run offline unit regression
        env:
          FOOTBALL_V2_FACTS_FIRST: '0'
        run: python -m unittest discover -s tests -v
      - name: Validate committed runtime assets and DuckDB
        run: python scripts/validate_project.py
